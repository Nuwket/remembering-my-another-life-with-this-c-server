<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C API Server — Console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --dim:#8b949e;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --amber:#d29922; }
  * { box-sizing:border-box; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  body { background:var(--bg); color:var(--txt); margin:0; padding:24px; }
  .wrap { max-width:1080px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--green); box-shadow:0 0 8px var(--green); }
  .dot.bad { background:var(--red); box-shadow:0 0 8px var(--red); }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--dim); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .card .k { color:var(--dim); font-size:11px; text-transform:uppercase; }
  .card .v { font-size:22px; margin-top:4px; }
  section.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  section.panel h2 { font-size:15px; margin:0 0 12px; color:var(--blue); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  input, textarea { background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; }
  input { flex:1; min-width:140px; }
  textarea { width:100%; min-height:56px; resize:vertical; }
  button { background:#1f6feb; color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:13px; }
  button:hover { background:#388bfd; }
  button.danger { background:#5a1f1f; }
  button.danger:hover { background:var(--red); }
  button.ghost { background:transparent; border:1px solid var(--line); }
  pre.out { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; font-size:12px;
            max-height:260px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:8px 0 0; }
  .toast { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:10; }
  .toast div { background:#2b1414; border:1px solid var(--red); border-radius:6px; padding:10px 14px; font-size:13px;
               max-width:360px; }
  .toast div.ok { background:#0f2b16; border-color:var(--green); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:normal; text-transform:uppercase; font-size:11px; }
  .links a { color:var(--blue); margin-right:14px; font-size:13px; }
  footer { color:var(--dim); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span id="dot" class="dot"></span>
    <div>
      <h1>C API Server — Console</h1>
      <div class="sub" id="healthLine">probing /health…</div>
    </div>
  </header>

  <div class="grid" id="metrics">
    <div class="card"><div class="k">requests</div><div class="v" id="mReq">–</div></div>
    <div class="card"><div class="k">errors</div><div class="v" id="mErr">–</div></div>
    <div class="card"><div class="k">kv keys</div><div class="v" id="mKv">–</div></div>
    <div class="card"><div class="k">notes</div><div class="v" id="mNotes">–</div></div>
    <div class="card"><div class="k">connections</div><div class="v" id="mConn">–</div></div>
  </div>

  <section class="panel">
    <h2>Key–Value store</h2>
    <div class="row">
      <input id="kvKey" placeholder="key  [A-Za-z0-9._-]{1,128}">
      <input id="kvVal" placeholder='value (JSON string)'>
      <button onclick="kvPut()">PUT</button>
      <button class="ghost" onclick="kvGet()">GET</button>
      <button class="danger" onclick="kvDel()">DEL</button>
    </div>
    <div class="row">
      <input id="kvPrefix" placeholder="prefix filter (optional)">
      <button class="ghost" onclick="kvList()">LIST</button>
    </div>
    <pre class="out" id="kvOut">—</pre>
  </section>

  <section class="panel">
    <h2>Notes</h2>
    <div class="row"><input id="nTitle" placeholder="title (1..200 chars)"></div>
    <div class="row"><textarea id="nBody" placeholder="body (0..8192 chars)"></textarea></div>
    <div class="row">
      <button onclick="noteCreate()">CREATE</button>
      <button class="ghost" onclick="noteList()">LIST</button>
      <input id="nId" placeholder="id" style="max-width:120px">
      <button class="ghost" onclick="noteGet()">GET</button>
      <button class="ghost" onclick="noteUpdate()">UPDATE</button>
      <button class="danger" onclick="noteDel()">DEL</button>
    </div>
    <pre class="out" id="nOut">—</pre>
  </section>

  <section class="panel">
    <h2>Echo / raw probe</h2>
    <div class="row">
      <input id="echoIn" placeholder='{"data":"hello"}'>
      <button onclick="doEcho()">POST /api/echo</button>
    </div>
    <pre class="out" id="echoOut">—</pre>
  </section>

  <section class="panel links">
    <h2>Shortcuts</h2>
    <a href="/health" target="_blank">/health</a>
    <a href="/metrics" target="_blank">/metrics</a>
    <a href="/api/kv?limit=50" target="_blank">/api/kv</a>
    <a href="/api/notes?limit=50" target="_blank">/api/notes</a>
  </section>

  <footer>C11 · thread-pool · SQLite WAL · typed errors — no frameworks, no CDN.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
"use strict";
async function req(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const txt = await r.text();
  let parsed = txt;
  try { parsed = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) { /* keep raw */ }
  if (!r.ok) toast(r.status + " " + parsed);
  return { status: r.status, body: parsed };
}
function toast(msg, ok) {
  const t = document.getElementById("toast");
  const d = document.createElement("div");
  if (ok) d.className = "ok";
  d.textContent = msg;
  t.appendChild(d);
  setTimeout(() => d.remove(), 6000);
}
async function refresh() {
  try {
    const h = await req("GET", "/health");
    const m = await req("GET", "/metrics");
    const hj = JSON.parse(h.body), mj = JSON.parse(m.body);
    document.getElementById("dot").className = "dot ok";
    document.getElementById("healthLine").textContent =
      "version " + hj.version + " · uptime " + hj.uptime_s + "s";
    document.getElementById("mReq").textContent = mj.http_requests;
    document.getElementById("mErr").textContent = mj.http_errors;
    document.getElementById("mKv").textContent = mj.kv_count;
    document.getElementById("mNotes").textContent = mj.notes_count;
    document.getElementById("mConn").textContent = mj.connections_accepted;
  } catch (e) {
    document.getElementById("dot").className = "dot bad";
    document.getElementById("healthLine").textContent = "unreachable: " + e;
  }
}
async function kvPut() {
  const k = document.getElementById("kvKey").value.trim();
  const v = document.getElementById("kvVal").value;
  const r = await req("PUT", "/api/kv/" + encodeURIComponent(k), { value: v });
  document.getElementById("kvOut").textContent = r.status + "\n" + r.body;
  refresh();
}
async function kvGet() {
  const k = document.getElementById("kvKey").value.trim();
  const r = await req("GET", "/api/kv/" + encodeURIComponent(k));
  document.getElementById("kvOut").textContent = r.status + "\n" + r.body;
}
async function kvDel() {
  const k = document.getElementById("kvKey").value.trim();
  const r = await req("DELETE", "/api/kv/" + encodeURIComponent(k));
  document.getElementById("kvOut").textContent = r.status + "\n" + r.body;
  refresh();
}
async function kvList() {
  const p = document.getElementById("kvPrefix").value.trim();
  const r = await req("GET", "/api/kv?limit=50" + (p ? "&prefix=" + encodeURIComponent(p) : ""));
  document.getElementById("kvOut").textContent = r.status + "\n" + r.body;
}
async function noteCreate() {
  const r = await req("POST", "/api/notes",
    { title: document.getElementById("nTitle").value, body: document.getElementById("nBody").value });
  document.getElementById("nOut").textContent = r.status + "\n" + r.body;
  refresh();
}
async function noteList() {
  const r = await req("GET", "/api/notes?limit=50");
  document.getElementById("nOut").textContent = r.status + "\n" + r.body;
}
async function noteGet() {
  const r = await req("GET", "/api/notes/" + document.getElementById("nId").value.trim());
  document.getElementById("nOut").textContent = r.status + "\n" + r.body;
}
async function noteUpdate() {
  const r = await req("PUT", "/api/notes/" + document.getElementById("nId").value.trim(),
    { title: document.getElementById("nTitle").value, body: document.getElementById("nBody").value });
  document.getElementById("nOut").textContent = r.status + "\n" + r.body;
  refresh();
}
async function noteDel() {
  const r = await req("DELETE", "/api/notes/" + document.getElementById("nId").value.trim());
  document.getElementById("nOut").textContent = r.status + "\n" + r.body;
  refresh();
}
async function doEcho() {
  let payload;
  try { payload = JSON.parse(document.getElementById("echoIn").value); }
  catch (e) { toast("400 invalid JSON: " + e); return; }
  const r = await req("POST", "/api/echo", payload);
  document.getElementById("echoOut").textContent = r.status + "\n" + r.body;
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
